specVersion: '5.0'
metadata:
  name: ui5-cc-spreadsheetimporter-v2-4-0
type: component
# customConfiguration:
#   ui5-middleware-ui5:
#     mountPath: /thirdparty/customcontrol/spreadsheetimporter/v2_4_0
# resources:
#   configuration:
#     paths:
#       /thirdparty/customcontrol/spreadsheetimporter/v2_4_0/: ./dist/
framework:
  name: OpenUI5
  version: 1.136.1
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-tooling-stringreplace-middleware
      afterMiddleware: compression
      configuration:
        files:
          - '**/*.js'
          - '**/*.xml'
          - '**/*.ts'
        replace:
          - placeholder: XXXnamespaceXXX
            value: v2_4_0
          - placeholder: XXXnamespaceShortXXX
            value: v240
          - placeholder: XXXnamespaceSlashXXX
            value: v2_4_0
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: ui5-tooling-stringreplace-middleware
      configuration:
        filePattern: .+(ts|tsx)
        transpileTypeScript: true
        transpileAsync: false
        generateDts: true
        removeConsoleStatements: false
    - name: ui5-tooling-modules-middleware
      afterMiddleware: ui5-tooling-transpile-middleware
      configuration:
        debug: verbose
        addToNamespace: true
        prependPathMappings: true
