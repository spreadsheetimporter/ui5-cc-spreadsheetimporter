on:
  push:
    branches:
      - main
name: release-please
jobs:
  release-please:
    runs-on: ubuntu-22.04
    outputs:
      prs: ${{ steps.release.outputs.prs }}
      importer_released: ${{ steps.release.outputs['packages/ui5-cc-spreadsheetimporter--release_created'] }}
    permissions:
      contents: read
    steps:
      - uses: googleapis/release-please-action@db8f2c60ee802b3748b512940dde88eabd7b7e01 # v3.7.13
        id: release
        with:
          token: ${{ secrets.GH_WORKFLOW_TOKEN }}
          command: manifest
          monorepo-tags: true
          release-type: node
          separate-pull-requests: false
      - name: log output
        run: |
          echo '${{toJSON(steps.release.outputs)}}'

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.importer_released == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.11.1
      - run: npm ci --legacy-peer-deps
      - run: npm run test:unit
      - run: npm run build --workspace=ui5-cc-spreadsheetimporter
      - name: Publish the component to npm
        working-directory: packages/ui5-cc-spreadsheetimporter
        run: npm publish --provenance --access public

      - name: Update the ABAP Deploy Repository
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_TOKEN }}
        run: gh workflow run updateversions.yml --repo spreadsheetimporter/packed-deployment-abap --ref main

  update-prs:
    needs: release-please
    if: needs.release-please.outputs.prs
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.release-please.outputs.prs) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup git user
        run: |
          git config --global user.email "ops+robot@npmjs.com"
          git config --global user.name "npm team"
      - name: use node 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Update PR ${{ matrix.pr.number }}
        if: ${{ matrix.pr }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_WORKFLOW_TOKEN }}
        run: |
          gh pr checkout ${{ matrix.pr.number }}
          npm install --legacy-peer-deps
          npm run replaceString
          npm run coypChangelogToDoc
          git add .
          git commit --amend --no-edit
          git push --force
